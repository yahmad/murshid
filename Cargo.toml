[package]
name = "murshid"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Local-first, zero-telemetry AI coding mentor that teaches through Socratic hints"
license = "AGPL-3.0-only"
repository = "https://github.com/yahmad/murshid"
homepage = "https://yahmad.com/thabit"
readme = "README.md"
keywords = ["cli", "ai", "mentor", "learning", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
rusqlite = { version = "0.31.0", features = ["bundled"] }
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.116"
keyring = "2.1.0"
libc = "0.2"
notify = "6.1.1"
tree-sitter = "0.26.10"
tree-sitter-rust = "0.24.2"
tree-sitter-go = "0.25.0"

# T15 TUI spike (MUR-7, branch yasir/mur-7-tui-spike): frontend-only exception
# to SPEC C10's stdlib allowlist, permitted for exactly these two crates.
# ratatui re-exports a matching crossterm; keep them a compatible pair.
ratatui = "0.29"
crossterm = "0.28"

# Lints are enforced in CI (`cargo clippy -- -D warnings`); denying the
# clippy default groups here keeps `cargo clippy` a hard gate locally too.
# The tree is clean at this level today — keep it that way.
[dev-dependencies]
# ROADMAP item 8: property-based tests (BKT unit-interval + pass-monotonicity,
# sanitizer idempotence + never-leak). Test-only; the single approved
# non-stdlib addition to the tree.
proptest = "1"

[lints.clippy]
all = "deny"
